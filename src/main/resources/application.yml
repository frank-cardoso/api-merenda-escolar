spring:
  application:
    name: api-merenda-escolar
  datasource:
    url: jdbc:h2:file:./data/merenda;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    model:
      chat: none

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

merenda:
  ia:
    provedor: fake
    modelo: regras-locais-v1
  analytics:
    base-url: ${MERENDA_ANALYTICS_BASE_URL:http://localhost:8000}
    timeout: ${MERENDA_ANALYTICS_TIMEOUT:2s}
