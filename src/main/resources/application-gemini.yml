spring:
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.6-flash}
            temperature: 0.2
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

merenda:
  ia:
    provedor: gemini
    modelo: ${GEMINI_MODEL:gemini-3.6-flash}
    http-timeout-segundos: 10
    timeout-segundos: 50
    fallback:
      base-url: https://api.groq.com/openai
      modelo: ${GROQ_MODEL:openai/gpt-oss-20b}
      http-timeout-segundos: 10
